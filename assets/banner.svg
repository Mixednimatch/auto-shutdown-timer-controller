<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f2a"/>
      <stop offset="55%" stop-color="#141a3d"/>
      <stop offset="100%" stop-color="#1d1440"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#39e6ff" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#39e6ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#39e6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffb347"/>
      <stop offset="100%" stop-color="#ff5f6d"/>
    </linearGradient>
    <linearGradient id="moonGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8ecff"/>
      <stop offset="100%" stop-color="#9aa8d6"/>
    </linearGradient>
    <radialGradient id="powerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#39e6ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#39e6ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="360" fill="url(#bg)"/>

  <!-- stars -->
  <circle cx="90" cy="60" r="1.6" fill="#ffffff" opacity="0.6"/>
  <circle cx="180" cy="40" r="1.2" fill="#ffffff" opacity="0.5"/>
  <circle cx="260" cy="90" r="1.8" fill="#ffffff" opacity="0.4"/>
  <circle cx="40" cy="150" r="1.3" fill="#ffffff" opacity="0.5"/>
  <circle cx="1120" cy="60" r="1.4" fill="#ffffff" opacity="0.6"/>
  <circle cx="1060" cy="300" r="1.3" fill="#ffffff" opacity="0.5"/>
  <circle cx="700" cy="50" r="1.5" fill="#ffffff" opacity="0.5"/>
  <circle cx="620" cy="300" r="1.2" fill="#ffffff" opacity="0.4"/>

  <!-- soft glow behind clock -->
  <circle cx="900" cy="180" r="190" fill="url(#glow)"/>

  <!-- crescent moon accent, upper right -->
  <g opacity="0.9">
    <circle cx="1030" cy="70" r="34" fill="url(#moonGrad)"/>
    <circle cx="1044" cy="60" r="30" fill="#0b0f2a"/>
  </g>

  <!-- clock face -->
  <circle cx="900" cy="180" r="128" fill="#0e1230" stroke="#2c3568" stroke-width="3"/>
  <circle cx="900" cy="180" r="112" fill="none" stroke="#39e6ff" stroke-width="1.5" opacity="0.35"/>

  <!-- countdown arc ring -->
  <path d="M 900 60 A 120 120 0 1 1 793 240" fill="none" stroke="url(#ringGrad)" stroke-width="10" stroke-linecap="round" opacity="0.95"/>

  <!-- hour ticks -->
  <g stroke="#8fa3e6" stroke-width="3" opacity="0.7">
    <line x1="900" y1="66" x2="900" y2="80"/>
    <line x1="900" y1="280" x2="900" y2="294"/>
    <line x1="686" y1="180" x2="700" y2="180"/>
    <line x1="1100" y1="180" x2="1114" y2="180"/>
    <line x1="748" y1="88" x2="757" y2="98"/>
    <line x1="1052" y1="88" x2="1043" y2="98"/>
    <line x1="748" y1="272" x2="757" y2="262"/>
    <line x1="1052" y1="272" x2="1043" y2="262"/>
  </g>

  <!-- clock hands pointing to shutdown moment -->
  <line x1="900" y1="180" x2="900" y2="110" stroke="#e8ecff" stroke-width="5" stroke-linecap="round"/>
  <line x1="900" y1="180" x2="955" y2="200" stroke="#e8ecff" stroke-width="5" stroke-linecap="round"/>
  <circle cx="900" cy="180" r="7" fill="#ffb347"/>

  <!-- power button icon centered subtly behind hands -->
  <circle cx="900" cy="180" r="46" fill="url(#powerGlow)" opacity="0.35"/>
  <path d="M900 148 L900 172" stroke="#39e6ff" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
  <path d="M881 165 A 26 26 0 1 0 919 165" fill="none" stroke="#39e6ff" stroke-width="6" stroke-linecap="round" opacity="0.85"/>

  <!-- thin circuit-like connectors trailing left from clock -->
  <g stroke="#39e6ff" stroke-width="2" opacity="0.35" fill="none">
    <path d="M772 180 L720 180 L720 130"/>
    <path d="M772 220 L730 220 L730 260"/>
    <circle cx="720" cy="130" r="4" fill="#39e6ff"/>
    <circle cx="730" cy="260" r="4" fill="#39e6ff"/>
  </g>

  <!-- headline -->
  <text x="60" y="168" font-family="'Segoe UI', Arial, sans-serif" font-size="76" font-weight="700" fill="#f4f7ff" textLength="640" lengthAdjust="spacingAndGlyphs">
    Auto Shutdown
  </text>
  <text x="60" y="248" font-family="'Segoe UI', Arial, sans-serif" font-size="76" font-weight="700" fill="#f4f7ff" textLength="300" lengthAdjust="spacingAndGlyphs">
    Timer
  </text>

  <!-- tagline -->
  <text x="60" y="292" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#aab4e6" textLength="700" lengthAdjust="spacingAndGlyphs">
    Schedules your Windows PC to shut down, restart, or sleep after a set time
  </text>
</svg>